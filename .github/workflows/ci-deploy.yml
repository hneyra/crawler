name: CI Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'prod'
        type: choice
        options: [prod]

env:
  REGISTRY: ghcr.io

jobs:
  # ─── 1. Tests ───────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      docker:
        image: docker:dind
        options: --privileged

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'

      - name: Publish test report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: build/test-results/test/*.xml
          fail_on_failure: true

  # ─── 2. Build & push Docker images ─────────────────────────────────────────
  build-images:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Generate image tag (short SHA)
        id: meta
        run: echo "version=$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── App image (frontend bundled inside Spring Boot) ──────────────────
      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/crawler-app:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/crawler-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Renderer image ────────────────────────────────────────────────────
      - name: Build and push renderer image
        uses: docker/build-push-action@v6
        with:
          context: ./renderer
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/crawler-renderer:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/crawler-renderer:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── 3. Deploy with Pulumi ──────────────────────────────────────────────────
  deploy:
    name: Deploy (Pulumi)
    runs-on: ubuntu-latest
    needs: build-images
    environment: ${{ github.event.inputs.environment || 'prod' }}

    steps:
      - uses: actions/checkout@v4

      # Load the deploy SSH key into ssh-agent so Pulumi can tunnel to Docker
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add server to known_hosts
        run: ssh-keyscan -H '${{ secrets.DEPLOY_HOST }}' >> ~/.ssh/known_hosts

      # Authenticate GHCR on the remote server so it can pull private images
      - name: Docker login to GHCR on remote server
        run: |
          ssh '${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}' \
            "echo '${{ secrets.GITHUB_TOKEN }}' | \
             docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: infrastructure/package-lock.json

      - name: Install Pulumi CLI
        uses: pulumi/actions@v5

      - name: Install infrastructure dependencies
        run: npm ci
        working-directory: infrastructure

      # Inject dynamic config values for this run
      - name: Configure Pulumi stack
        working-directory: infrastructure
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: |
          pulumi config set docker:host \
            "ssh://${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            --stack prod
          pulumi config set crawler:imageTag \
            "${{ needs.build-images.outputs.image-tag }}" \
            --stack prod
          pulumi config set crawler:repoOwner \
            "${{ github.repository_owner }}" \
            --stack prod

      - name: Pulumi up
        working-directory: infrastructure
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: pulumi up --yes --stack prod
