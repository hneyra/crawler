services:
  postgres:
    image: postgres:16
    container_name: crawler-postgres
    environment:
      POSTGRES_DB: crawler
      POSTGRES_USER: crawler
      POSTGRES_PASSWORD: crawler
    ports:
      - "5432:5432"
    volumes:
      - crawler-pgdata:/var/lib/postgresql/data

  renderer:
    build: ./renderer
    container_name: crawler-renderer
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DEFAULT_TIMEOUT: "30000"

  grafana-agent:
    image: grafana/agent:latest
    container_name: crawler-grafana-agent
    volumes:
      - ./grafana-agent.yml:/etc/agent/config.yml
    command:
      - -config.file=/etc/agent/config.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: []

volumes:
  crawler-pgdata:
