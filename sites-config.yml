sites:
  - name: Adondevivir.com
    baseUrl: https://www.adondevivir.com
    enabled: true
    politenessDelayMs: 1000
    extractionConfig:
      detailStrategy: SCRIPT_JSON
      fieldSelectors:
        title: "h1.title-h1-development"
      scriptPatterns:
        - "const\\s+avisoInfo\\s*=\\s*(\\{.*?\\});\\s*$"
      jsonPaths:
        title: "$.units[0].title"
        generatedTitle: "$.units[0].generatedTitle"
        description: "$.units[0].descriptionNormalized"
        realEstateType: "$.units[0].realEstateType.name"
        postingType: "$.units[0].postingType"
        price: "$.units[0].priceOperationTypes[0].prices[0].amount"
        currency: "$.units[0].priceOperationTypes[0].prices[0].currency"
        currencyCode: "$.units[0].priceOperationTypes[0].prices[0].isoCode"
        operationType: "$.units[0].priceOperationTypes[0].operationType.name"
        totalArea: "$.units[0].mainFeatures.CFT100.value"
        coveredArea: "$.units[0].mainFeatures.CFT101.value"
        bedrooms: "$.units[0].mainFeatures.CFT2.value"
        bathrooms: "$.units[0].mainFeatures.CFT3.value"
        antiquity: "$.units[0].mainFeatures.CFT5.value"
        address: "$.units[0].postingLocation.address.name"
        neighborhood: "$.units[0].postingLocation.location.name"
        zone: "$.units[0].postingLocation.location.parent.name"
        city: "$.units[0].postingLocation.location.parent.parent.name"
        latitude: "$.units[0].postingLocation.postingGeolocation.geolocation.latitude"
        longitude: "$.units[0].postingLocation.postingGeolocation.geolocation.longitude"
        imageUrl: "$.units[0].pictures[0].url1200x1200"
        url: "$.units[0].url"
        postingId: "$.units[0].postingId"
    categories:
      - name: alquiler-en-san-miguel
        url: https://www.adondevivir.com/casas-o-departamentos-o-terrenos-o-oficinas-o-locales-comerciales-en-alquiler-en-san-miguel.html
        paginationType: PAGE_PARAM
        nextPageSelector: a[data-qa=PAGING_NEXT]
#        itemLinkSelector: .main-module__list-postings-container
        itemLinkSelector: div[data-to-posting]
        linkExtractionType: DATA_ATTRIBUTE
        linkAttribute: data-to-posting
        enabled: true

  - name: REMAX Perú
    baseUrl: https://www.remax.pe
    enabled: true
    politenessDelayMs: 1500
    extractionConfig:
      detailStrategy: HTML
      fieldSelectors:
        title: ".titulo_01 h1"
        propertyType: ".status_float .badge-blue"
        location: ".titulo_07 h5"
        description: ".__text_match"
        priceRaw: ".titulo_04"
        coverImage: "meta[property=og:image]::attr(content)"
        agentName: ".__agenteintpro h2"
        agentOffice: ".__agenteintpro h4"
      listFieldSelectors:
        images: ".sp-slide img::attr(data-src)"
      regexFields:
        externalId: "ID:\\s*(\\d+)"
        priceSoles: "S/\\.\\s*([\\d,\\.']+)"
        priceUsd: "USD\\s*([\\d,\\.']+)"
        agentPhone: "href=\"tel:(\\d+)\""
        latitude: "setView\\(\\[(-?[0-9.]+),\\s*-?[0-9.]+\\]"
        longitude: "setView\\(\\[-?[0-9.]+,\\s*(-?[0-9.]+)\\]"
        publishedDate: "Publicada\\s*:\\s*([^<]+)<br"
      labelValueBlocks:
        - containerSelector: "#collapse_2, #collapse_3"
          itemSelector: ".col-6"
          labelSelector: "label.__bodyt"
          valueSelector: "p.__bodyc"
          targetKey: specs
    # NOTA: no se configuran categorías (páginas de listado) todavia porque
    # no se dispone del HTML real de una página de búsqueda/listado de REMAX.
    # Los selectores de descubrimiento (itemLinkSelector, paginationType, etc.)
    # deben definirse a partir de esa página para evitar selectores adivinados.
    categories: []
