spring:
  application:
    name: crawler

  datasource:
    url: jdbc:postgresql://localhost:5432/crawler
    username: postgres
    password: postgres

    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  batch:
    jdbc:
      initialize-schema: always

crawler:
  raw-data-dir: ${user.home}/crawler-data/
