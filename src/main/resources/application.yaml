spring:
  application:
    name: crawler
  main:
    allow-bean-definition-overriding: true

  datasource:
    url: jdbc:postgresql://localhost:5432/crawler
    username: crawler
    password: crawler

    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  batch:
    jdbc:
      initialize-schema: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: crawler

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [siteId=%X{siteId:-} categoryId=%X{categoryId:-} url=%X{url:-}] %logger{36} - %msg%n"

crawler:
  raw-data-dir: ${user.home}/tmp/crawler-data/
#  raw-data-dir: file:///E:/crawler-data/
  discovery-max-pages: 50
  extraction-batch-size: 10
  renderer-base-url: http://localhost:3000
  retry-max-retries: 3
  retry-interval-ms: 600000
